
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 HALLOWEEN 2026 | Boo! 👻🎃</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css" />
	
  <!-- script title -->
  <script>
  let titleText = "🎃 HALLOWEEN 2026 | Boo! 👻 ";
  let position = 0;

  function scrollTitle() {
    document.title = titleText.substring(position) + titleText.substring(0, position);
    position = (position + 1) % titleText.length;
    setTimeout(scrollTitle, 200); // Vitesse de défilement
  }

  scrollTitle();
</script>


  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Nosifer', monospace;
      background-image: url('background.jpg');
      background-size: cover;
      background-attachment: fixed;
      color: #FFA500;
      text-align: center;
    }

    /* Dégradé sombre haut de page */
    .header-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 160px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
      z-index: 100;
    }

    /* Boîte du titre + compte à rebours */
    .header-content {
      position: relative;
      z-index: 200;
      display: inline-block;
      margin-top: 20px;
    }

    h1 {
      margin: 0;
      color: #BCAD21;
      text-shadow: 2px 2px 5px #000;
      font-size: 2em;
    }

    #countdown {
      font-size: 1.5em;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px #000;
      margin-top: 8px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: none;
    }

    .map-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 10px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
    }

    #map {
      height: 500px;
      width: 100%;
    }

    /* Keep map attribution visible as required by map providers. */

    .popup-animated-text {
      font-family: 'Nosifer', monospace;
      font-size: 16px;
      font-weight: bold;
      color: #FFA500;
      text-align: center;
      text-shadow: 0 0 5px #FF6600, 0 0 10px #FF3300, 0 0 15px #FF0000;
      animation: flicker 1.2s infinite alternate;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #000;
    }

    .custom-emoji-icon {
      font-size: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* Filtres visuels */
    .halloween-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,140,0,0.1), rgba(0,0,0,0.4));
      z-index: 400; /* sous les popups Leaflet */
    }

    .fog-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      pointer-events: none;
      background: url('fog-overlay-png-5.png') repeat;
      opacity: 0.5;
      animation: fogMove 120s linear infinite;
      transform: translate(-25%, -25%);
      z-index: 300;
    }

    @keyframes fogMove {
      from { transform: translate(-25%, -25%); }
      to   { transform: translate(0%, 0%); }
    }
	  
    @media (min-width: 1200px) {
      #map {
        height: 75vh;
      }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.3em; }
      #map { height: 600px; }
    }
  </style>
</head>
<body>

  <div class="header-overlay"></div>

  <div class="header-content">
    <h1>🎃👻 HALLOWEEN 2026 👻🎃</h1>
    <div id="countdown"></div>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="halloween-overlay"></div>
  </div>

  <div id="map-status" role="status" aria-live="polite"
       style="font: 14px Arial, sans-serif; color: #ffb347; margin: 8px auto 18px; padding: 0 12px;">
    Chargement des maisons…
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>

  <script>
    // Compte à rebours
    function updateCountdown() {
      const now = new Date();
      const target = new Date(now.getFullYear(), 9, 31, 0, 0, 0);
      const diff = target - now;

      if (diff <= 0) {
        document.getElementById('countdown').textContent = "🦇🎃🪦🕷️🪦🎃🦇";
        clearInterval(timerInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').textContent =
        `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown();

    // Carte Leaflet
    const map = L.map('map', {
      fullscreenControl: true
    }).setView([50.8439831, 4.4902064], 14);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);

    const pumpkinIcon = L.divIcon({
      className: 'custom-emoji-icon',
      html: '🎃',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
    });

    const messages = [
      "Haunted place 👻",
      "Lieu hanté 👻",
      "Spookplaats 👻"
    ];

    function createAnimatedMarker(lat, lng, id) {
      const marker = L.marker([lat, lng], {
        icon: pumpkinIcon
      }).addTo(map)
        .bindPopup(
          `<div class="popup-animated-text" id="popup-text-${id}">${messages[0]}</div>`
        )
        .on('popupopen', () => {
          let index = 0;
          const popupText = document.getElementById(`popup-text-${id}`);

          marker.intervalId = setInterval(() => {
            index = (index + 1) % messages.length;
            if (popupText) {
              popupText.textContent = messages[index];
            }
          }, 2000);
        })
        .on('popupclose', () => {
          clearInterval(marker.intervalId);
        });
    }

    // ==========================================
    // CHARGEMENT AUTOMATIQUE DES MAISONS
    // ==========================================
    // Les maisons sont chargées depuis maisons.json.
    // Pour les mettre à jour, remplacer uniquement
    // ce fichier sur GitHub.

    async function chargerMaisons() {
      const status = document.getElementById('map-status');

      try {
        const response = await fetch('./maisons.json', {
          cache: 'no-cache'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const coords = await response.json();

        if (
          !Array.isArray(coords) ||
          !coords.every(point =>
            Array.isArray(point) &&
            point.length === 2 &&
            point.every(Number.isFinite) &&
            Math.abs(point[0]) <= 90 &&
            Math.abs(point[1]) <= 180
          )
        ) {
          throw new Error('Format de maisons.json invalide');
        }

        coords.forEach((coord, index) => {
          createAnimatedMarker(
            coord[0],
            coord[1],
            index + 1
          );
        });

        status.textContent =
          coords.length + ' maison(s) participante(s)';

      } catch (error) {
        console.error(
          'Erreur de chargement des maisons :',
          error
        );

        status.textContent =
          'Impossible de charger maisons.json. ' +
          'Vérifiez que le fichier est publié ' +
          'à côté de index.html.';
      }
    }

    chargerMaisons();

  </script>
</body>
</html>
